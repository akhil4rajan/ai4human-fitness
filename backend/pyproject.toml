[project]
name = "ai4human"
version = "0.1.0"
description = "Multi-agent holistic health companion (wellness, non-clinical)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "claude-agent-sdk>=0.2",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
