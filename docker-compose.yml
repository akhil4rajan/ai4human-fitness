services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      AI4HUMAN_DB: /data/ai4human.db
    volumes:
      - ai4human-data:/data
    # Not published: the browser only talks to the frontend, which proxies /api.
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ai4human-data:
